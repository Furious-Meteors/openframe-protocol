name: App Testing

on:
  push:
    branches:
      - dev
      - production

  pull_request:
    branches:
      - dev
      - production

  workflow_call:

jobs:
  test:
    name: "${{ matrix.package }} — Python ${{ matrix.python-version }}"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        package:
          - openframe-protocol-base
          - openframe-protocol-http
          - openframe-protocol-grpc

    defaults:
      run:
        working-directory: packages/${{ matrix.package }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      # openframe-protocol-base is not yet published to PyPI (unlike
      # openframe-core/openframe-adapters-*), so pip can't resolve it as a
      # dependency of openframe-protocol-http/-grpc on a clean runner —
      # confirmed by a real CI failure ("No matching distribution found for
      # openframe-protocol-base"), not assumed. Installing it from this
      # same checkout first means pip finds the requirement already
      # satisfied locally and never needs to reach the index for it.
      # Harmless no-op duplication for the openframe-protocol-base matrix
      # entry itself.
      - name: Install openframe-protocol-base from this checkout (not on PyPI yet)
        working-directory: ${{ github.workspace }}
        run: pip install -e packages/openframe-protocol-base

      - name: Install ${{ matrix.package }} with dev dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short
