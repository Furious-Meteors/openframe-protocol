name: App Testing

on:
  push:
    branches:
      - dev
      - production

  pull_request:
    branches:
      - dev
      - production

  workflow_call:

jobs:
  test:
    name: "${{ matrix.package }} — Python ${{ matrix.python-version }}"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        package:
          - openframe-protocol-base
          - openframe-protocol-http
          - openframe-protocol-grpc
          - openframe-protocol-media

    defaults:
      run:
        working-directory: packages/${{ matrix.package }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      # openframe-protocol-media's real-infrastructure spike tests
      # (test_ingest_spike.py, test_hls_pull_spike.py, test_dash_pull_spike.py)
      # spawn a real ffmpeg subprocess — confirmed by a real CI failure
      # (FileNotFoundError resolving ffmpeg) that ubuntu-latest does not
      # ship ffmpeg preinstalled, not assumed.
      - name: Install ffmpeg
        if: matrix.package == 'openframe-protocol-media'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      # openframe-protocol-base is not yet published to PyPI (unlike
      # openframe-core/openframe-adapters-*), so pip can't resolve it as a
      # dependency of openframe-protocol-http/-grpc on a clean runner —
      # confirmed by a real CI failure ("No matching distribution found for
      # openframe-protocol-base"), not assumed. Installing it from this
      # same checkout first means pip finds the requirement already
      # satisfied locally and never needs to reach the index for it.
      # Harmless no-op duplication for the openframe-protocol-base matrix
      # entry itself.
      - name: Install openframe-protocol-base from this checkout (not on PyPI yet)
        working-directory: ${{ github.workspace }}
        run: pip install -e packages/openframe-protocol-base

      - name: Install ${{ matrix.package }} with dev dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short --cov=openframe --cov-report=term-missing

  lint-and-typecheck:
    name: "${{ matrix.package }} — ruff + mypy"
    runs-on: ubuntu-latest
    # One Python version, not the full matrix above — lint/type-check
    # results don't vary meaningfully across 3.11-3.14 for this codebase,
    # and running them four times each would just slow CI down for no
    # real coverage gain.

    strategy:
      fail-fast: false
      matrix:
        package:
          - openframe-protocol-base
          - openframe-protocol-http
          - openframe-protocol-grpc
          - openframe-protocol-media

    defaults:
      run:
        working-directory: packages/${{ matrix.package }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install openframe-protocol-base from this checkout (not on PyPI yet)
        working-directory: ${{ github.workspace }}
        run: pip install -e packages/openframe-protocol-base

      - name: Install ${{ matrix.package }} with dev dependencies
        run: pip install -e ".[dev]"

      - name: ruff check
        # Picks up the repo-root pyproject.toml's [tool.ruff] (generated
        # protobuf files excluded, BLE001/B008 ignored as documented
        # deliberate idioms there) via ruff's own upward config search —
        # no per-package config needed.
        run: ruff check .

      - name: mypy
        # --namespace-packages/--explicit-package-bases: these packages are
        # PEP 420 namespace packages (openframe.protocol.http, etc., no
        # __init__.py at the openframe/ or openframe/protocol/ level) —
        # without both flags mypy can't map file paths to module names at
        # all and fails immediately on the first file it looks at.
        run: mypy openframe --ignore-missing-imports --namespace-packages --explicit-package-bases

  test-lowest-versions:
    name: "${{ matrix.package }} — lowest declared floors"
    runs-on: ubuntu-latest
    # Catches exactly the version-floor drift that let pyproject.toml claim
    # openframe-core>=3.2.1/openframe-protocol-base>=0.1 while the code
    # actually imported symbols (SessionHandler, session.py) that only
    # exist from 3.8.0/0.4.0 — a floor pip would happily resolve to on a
    # clean install, and the `test` job above never catches, since it
    # always installs whatever pip's resolver picks (effectively latest).

    strategy:
      fail-fast: false
      matrix:
        include:
          - package: openframe-protocol-http
            core-floor: "3.8.0"
            base-floor: "0.4.0"
          - package: openframe-protocol-grpc
            core-floor: "3.8.0"
            base-floor: "0.4.0"
          - package: openframe-protocol-media
            core-floor: "3.10.0"
            base-floor: "0.4.0"

    defaults:
      run:
        working-directory: packages/${{ matrix.package }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      # See the `test` job's own "Install ffmpeg" step above for why this
      # is needed for openframe-protocol-media's real-infrastructure spikes.
      - name: Install ffmpeg
        if: matrix.package == 'openframe-protocol-media'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install openframe-protocol-base at its floor from this checkout
        working-directory: ${{ github.workspace }}
        run: pip install -e packages/openframe-protocol-base

      - name: Install the package with every dependency pinned to its declared floor
        run: |
          pip install -e ".[dev]" \
            "openframe-core==${{ matrix.core-floor }}" \
            "openframe-protocol-base==${{ matrix.base-floor }}"

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short
