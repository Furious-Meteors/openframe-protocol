name: Build & Publish Python Packages

on:
  push:
    branches:
      - production

  workflow_dispatch:

jobs:
  test:
    name: Run test suite
    uses: ./.github/workflows/app-test.yml

  release:
    name: Release ${{ matrix.package }}
    needs: test
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      # 4 new project names (3 packages + meta) in this repo's first
      # release — nowhere near the ~4-8 threshold that tripped
      # openframe-adapters' PyPI "too many new projects" quota. Still
      # serialised from day one rather than relearning that lesson here.
      max-parallel: 1
      matrix:
        package:
          - packages/openframe-protocol-base
          - packages/openframe-protocol-http
          - packages/openframe-protocol-grpc
          - meta/openframe-protocol

    environment:
      name: pypi
      url: https://pypi.org/search/?q=openframe-protocol

    # PyPI Trusted Publishing (OIDC) — configured from day one, same
    # pattern openframe-adapters/openframe-core use. Each package needs
    # its own trusted publisher entry at:
    #   https://pypi.org/manage/project/<package-name>/settings/publishing/
    #
    # `contents: read` is required here even though this job never writes
    # to the repo — declaring `permissions:` at all REPLACES the default
    # token permissions entirely rather than adding to them, so
    # `id-token: write` alone strips the read access `actions/checkout`
    # needs, and it fails with a misleading "repository not found" instead
    # of a permissions error. Confirmed from a real CI run, not assumed —
    # every `test` job (no `permissions:` override, so it kept the
    # default `contents: read`) checked out fine in the same run while
    # every `release` job's checkout failed.
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Build
        working-directory: ${{ matrix.package }}
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build
          ls -lh dist/

      - name: Publish to PyPI
        # Trusted Publishing (OIDC), per this job's own `permissions:
        # id-token: write` above and the comment explaining it — no
        # `password:` input. Passing `secrets.PYPI_API_TOKEN` here as well
        # (the previous state of this step) made the job look OIDC-based
        # while actually authenticating with a long-lived token instead,
        # since gh-action-pypi-publish prefers an explicit password over
        # ambient OIDC when both are present. Requires a trusted publisher
        # already registered for each package at
        # https://pypi.org/manage/project/<package-name>/settings/publishing/
        # (PyPI's "pending publisher" feature supports registering one for
        # a package that hasn't been published yet) before the next push
        # to `production` — confirm that's done, or this step will fail.
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ${{ matrix.package }}/dist/
          skip-existing: true
          attestations: false
