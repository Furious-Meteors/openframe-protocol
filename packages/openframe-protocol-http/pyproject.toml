[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openframe-protocol-http"
version = "0.8.0"
description = "OpenFrame Microservice Suite - HTTP/ASGI server binding for openframe.core.inbound handlers."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
keywords = ["openframe", "protocol", "http", "fastapi", "hexagonal", "microservice"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "openframe-core>=3.2.1,<4",
    "openframe-protocol-base>=0.1,<1",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.110",
]
client = [
    "httpx>=0.27",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
    "fastapi>=0.110",
    "httpx>=0.27",
    "uvicorn>=0.30",
]

[[project.authors]]
name = "Furious Meteors Engineering"
email = "engineering@furiousmeteors.dev"

[[project.maintainers]]
name = "Furious Meteors Engineering"
email = "engineering@furiousmeteors.dev"

[project.urls]
Homepage      = "https://github.com/Furious-Meteors/openframe-protocol"
Documentation = "https://furious-meteors.github.io/openframe-protocol/"
Repository    = "https://github.com/Furious-Meteors/openframe-protocol"
Changelog     = "https://github.com/Furious-Meteors/openframe-protocol/blob/production/.github/CHANGELOG.md"
"Bug Tracker" = "https://github.com/Furious-Meteors/openframe-protocol/issues"

[tool.hatch.build.targets.wheel]
packages = ["openframe"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
