[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openframe-protocol-base"
version = "0.4.2"
description = "OpenFrame Microservice Suite - shared transport-neutral protocol mechanics (error mapping, RequestContext construction, inbound conformance suite)."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
keywords = ["openframe", "protocol", "hexagonal", "microservice"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    # 3.8.0 is where SessionHandler/Session/CloseReason (ADR-008) land,
    # imported directly by session.py — a floor of 3.2.1 resolves to a
    # core release that doesn't have them at all.
    "openframe-core>=3.8.0,<4",
    "opentelemetry-api>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
    "pytest-cov>=5.0",
    "ruff>=0.17",
    "mypy>=1.13",
]

[[project.authors]]
name = "Furious Meteors Engineering"
email = "engineering@furiousmeteors.dev"

[[project.maintainers]]
name = "Furious Meteors Engineering"
email = "engineering@furiousmeteors.dev"

[project.urls]
Homepage      = "https://github.com/Furious-Meteors/openframe-protocol"
Documentation = "https://furious-meteors.github.io/openframe-protocol/"
Repository    = "https://github.com/Furious-Meteors/openframe-protocol"
Changelog     = "https://github.com/Furious-Meteors/openframe-protocol/blob/production/.github/CHANGELOG.md"
"Bug Tracker" = "https://github.com/Furious-Meteors/openframe-protocol/issues"

[tool.hatch.build.targets.wheel]
packages = ["openframe"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
