[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openframe-protocol-media"
version = "0.4.0"
description = "OpenFrame Microservice Suite - RTMP ingest, HLS/DASH pull ingest, and HLS/DASH delivery binding for openframe.core.inbound handlers."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
keywords = ["openframe", "protocol", "media", "rtmp", "hexagonal", "microservice"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    # 3.10.0: openframe.core.media.MediaFrame/MediaKind (3.9.0) plus
    # MediaSegment (new in 3.10.0), the latter imported directly by
    # hls_pull.py — this package's shared frame/segment vocabulary.
    "openframe-core>=3.10.0,<4",
    # 0.4.0: session.py's open_session/run_opened_session, used directly
    # by ingest.py's _MediaController and hls_pull.py's pull_hls to drive
    # the SessionHandler lifecycle.
    "openframe-protocol-base>=0.4,<1",
]

[project.optional-dependencies]
ingest = [
    "pyrtmp>=0.3",
]
delivery = [
    "fastapi>=0.110",
]
pull = [
    # httpx + m3u8: HLS pull (hls_pull.py). mpegdash: DASH pull (dash_pull.py) -- both pull
    # ingest transports share this one extra rather than splitting into [pull-hls]/[pull-dash],
    # since both are thin, both commonly installed together, and neither pulls in anything
    # heavy enough to justify the split.
    "httpx>=0.27",
    "m3u8>=6.0",
    "mpegdash>=0.4",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
    "pyrtmp>=0.3",
    "fastapi>=0.110",
    "httpx>=0.27",
    "m3u8>=6.0",
    "mpegdash>=0.4",
    # Real local uvicorn server used by test_{hls,dash}_pull_{conformance,spike}.py
    # as a test origin to poll pull_hls/pull_dash against -- not a runtime
    # dependency of this package, so it belongs only in [dev], not in the
    # ingest/delivery/pull extras.
    "uvicorn>=0.30",
    "pytest-cov>=5.0",
    "ruff>=0.17",
    "mypy>=1.13",
]

[[project.authors]]
name = "Furious Meteors Engineering"
email = "engineering@furiousmeteors.dev"

[[project.maintainers]]
name = "Furious Meteors Engineering"
email = "engineering@furiousmeteors.dev"

[project.urls]
Homepage      = "https://github.com/Furious-Meteors/openframe-protocol"
Documentation = "https://furious-meteors.github.io/openframe-protocol/"
Repository    = "https://github.com/Furious-Meteors/openframe-protocol"
Changelog     = "https://github.com/Furious-Meteors/openframe-protocol/blob/production/.github/CHANGELOG.md"
"Bug Tracker" = "https://github.com/Furious-Meteors/openframe-protocol/issues"

[tool.hatch.build.targets.wheel]
packages = ["openframe"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
