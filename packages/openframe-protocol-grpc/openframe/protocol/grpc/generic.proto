syntax = "proto3";
package openframe.protocol.grpc;

// One generic message pair instead of one per route — mirrors server.py's
// own inspect.Signature trick for HTTP: the wire schema doesn't need to
// know the domain type, only that a JSON-encoded payload travels inside it.
// The actual domain type is JSON-encoded inside json_payload.
message GenericRequest {
  string json_payload = 1;
}

message GenericResponse {
  string json_payload = 1;
}

service GenericService {
  rpc Call(GenericRequest) returns (GenericResponse);
  // Bidirectional streaming counterpart to Call, same route-multiplexing
  // trick (x-openframe-route metadata) — the SessionHandler (ADR-008)
  // binding, not a per-route message type.
  rpc CallStream(stream GenericRequest) returns (stream GenericResponse);
}
