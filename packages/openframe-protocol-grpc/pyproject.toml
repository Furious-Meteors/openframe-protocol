[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openframe-protocol-grpc"
version = "0.4.2"
description = "OpenFrame Microservice Suite - gRPC server and client binding for openframe.core.inbound/remote."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
keywords = ["openframe", "protocol", "grpc", "hexagonal", "microservice"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    # 3.8.0: SessionHandler/CloseReason (ADR-008), imported directly by
    # server.py for bind_service_stream. 0.4.0: session.py (open_session/
    # send_error_event) itself didn't exist in -base before that release.
    "openframe-core>=3.8.0,<4",
    "openframe-protocol-base>=0.4,<1",
]

[project.optional-dependencies]
server = [
    "grpcio>=1.60",
    # generic_pb2.py (the generated code generic.proto compiles to)
    # imports google.protobuf directly — confirmed grpcio itself declares
    # no protobuf dependency of its own (only typing-extensions), so
    # without this, a clean install resolving grpcio alone would be
    # missing it; grpcio-tools (dev-only) happens to pull it in too,
    # which is what let this go unnoticed in tests.
    "protobuf>=5.26",
    # bind_service's input_model casting / output serialisation
    # (TypeAdapter, BaseModel.model_dump) — a real runtime dependency now,
    # not just a test-only one, since a real handler built for -http
    # (expecting a validated domain object, not a raw decoded dict) needs
    # this to work over gRPC at all.
    "pydantic>=2.0",
]
client = [
    # Unlike HTTP, gRPC's client and server share the same core
    # dependency — there is no separate "client-only" wire library.
    "grpcio>=1.60",
    "protobuf>=5.26",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
    "grpcio>=1.60",
    "grpcio-tools>=1.60",
    "pydantic>=2.0",
    "pytest-cov>=5.0",
    "ruff>=0.17",
    "mypy>=1.13",
]

[[project.authors]]
name = "Furious Meteors Engineering"
email = "engineering@furiousmeteors.dev"

[[project.maintainers]]
name = "Furious Meteors Engineering"
email = "engineering@furiousmeteors.dev"

[project.urls]
Homepage      = "https://github.com/Furious-Meteors/openframe-protocol"
Documentation = "https://furious-meteors.github.io/openframe-protocol/"
Repository    = "https://github.com/Furious-Meteors/openframe-protocol"
Changelog     = "https://github.com/Furious-Meteors/openframe-protocol/blob/production/.github/CHANGELOG.md"
"Bug Tracker" = "https://github.com/Furious-Meteors/openframe-protocol/issues"

[tool.hatch.build.targets.wheel]
packages = ["openframe"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
